<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
<title>文档预览</title>
<style>
  :root {
    --bg: #0F1019;
    --fg: #E6E8EF;
    --dim: #8B90A0;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Noto Sans CJK SC", "PingFang SC", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--dim);
    background: var(--bg);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #bar .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #credit { flex: none; opacity: 0.75; }
  #status {
    padding: 18px 16px;
    font-size: 13px;
    color: var(--dim);
  }
  #viewer {
    padding: 0 2px 24px;
  }
  /* 文档纸面保持白底，看起来更像"纸"，四周留出深色画布 */
  #viewer :where(.ufp-viewer, .document, .page) { color-scheme: light; }

  /* 手机端：不要按 A4 固定纸宽渲染，否则左右大量留白、正文被挤成每行几个字 */
  @media (max-width: 720px) {
    #viewer,
    #viewer .ufp-root,
    #viewer .ufp-content,
    #viewer .ufp-word-document {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box !important;
    }
    #viewer .ufp-content { padding: 8px 6px 24px !important; overflow-x: hidden !important; }
    #viewer .ufp-word-document { align-items: stretch !important; gap: 10px !important; }
    #viewer .ufp-word-page {
      width: 100% !important;
      max-width: 100% !important;
      min-height: 0 !important;
      padding: 24px 18px 34px !important;
      box-shadow: none !important;
      border-radius: 0 !important;
    }
    #viewer .ufp-word-page p { line-height: 1.65; }
  }
</style>
</head>
<body>
<div id="bar">
  <span id="meta" class="grow"></span>
  <span id="credit">Universal File Preview · MIT</span>
</div>
<div id="status">正在解析…</div>
<div id="viewer"></div>
<script src="bundle.js"></script>
<script>
  // 原生端通过查询参数把主题色传进来，保证和 App 主色调一致
  (function () {
    const q = new URLSearchParams(location.search);
    const bg = q.get("bg");
    const fg = q.get("fg");
    if (bg) document.documentElement.style.setProperty("--bg", "#" + bg.replace("#", ""));
    if (fg) document.documentElement.style.setProperty("--fg", "#" + fg.replace("#", ""));
  })();
</script>
</body>
</html>
